plugins {
  id 'java'
  id 'org.jetbrains.intellij.platform' version '2.9.0'
}

group = 'uk.ac.manchester.beehive.tornado.plugins'
version = '2.1.0'

java {
  toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

// Repositories for dependencies live here only; settings.gradle.kts declares
// just the plugin repositories.
repositories {
  mavenCentral()
  // REQUIRED so 2.x can find the IDE + bundled modules
  intellijPlatform { defaultRepositories() }
}

dependencies {
  intellijPlatform {
    intellijIdea("2026.1.2")   // target IDE

    // Bundled plugins you actually need on the classpath:
    bundledPlugin("com.intellij.java")

    // If your code touches TOML PSI or APIs, add this (since your error mentioned TOML):
    // bundledPlugin 'org.toml.lang'

    testFramework(org.jetbrains.intellij.platform.gradle.TestFrameworkType.Platform.INSTANCE)
    testFramework(org.jetbrains.intellij.platform.gradle.TestFrameworkType.Plugin.Java.INSTANCE)
  }

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.opentest4j:opentest4j:1.3.0'
}

// Java bytecode 17 (safe & works on JBR21)
tasks.withType(JavaCompile).configureEach {
  sourceCompatibility = '17'
  targetCompatibility = '17'
}

// plugin.xml compatibility
tasks.named('patchPluginXml') {
  it.sinceBuild.set('231')
}

// ./gradlew verifyPlugin checks the plugin against the IDEs JetBrains recommends
// for its since/until range (downloads those IDEs on first use)
intellijPlatform {
  pluginVerification {
    ides {
      recommended()
    }
  }
}

// optional: not needed on modern IDEs
tasks.named('buildSearchableOptions') { it.enabled = false }
